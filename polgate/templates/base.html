<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t("app.name") }}{% endblock %}</title>
  {# HTMX would otherwise inject a <style> element for its indicators, which the policy blocks.
     It also leaves a 4xx or 5xx answer out of the page by default, while every error partial here
     (a refused upload, an empty message, a translated error line) is written to be swapped in.
     Evaluating strings and running scripts in swapped content stay off even though the policy
     would block both: nothing here needs them, and the policy may not always be this strict. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false,
    "allowEval": false, "allowScriptTags": false,
    "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true},
                         {"code": "[45]..", "swap": true, "error": true}]}'>
  <link rel="stylesheet" href="{{ asset_url('style.css') }}">
  <link rel="icon" href="/static/favicon.svg">
  <script src="{{ asset_url('htmx.min.js') }}" defer></script>
  <script src="{{ asset_url('app.js') }}" defer></script>
</head>
<body>
<a class="skip-link" href="#main">{{ t("a11y.skip") }}</a>
{# The chat has no bar of its own: its sidebar carries the name and the account. #}
{% block topbar %}
<header class="topbar{{ ' signed-in' if user }}">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>{{ t("app.name") }}</a>
  <nav class="topnav">
    {% if user %}
      <a class="navlink {{ 'active' if request.url.path.startswith('/chat') }}" href="/chat"
         aria-label="{{ t('nav.chat') }}" title="{{ t('nav.chat') }}">
        <span>{{ t("nav.chat") }}</span>
      </a>
      {% if user.role.value == "admin" %}
        <a class="navlink {{ 'active' if request.url.path.startswith('/admin') }}" href="/admin"
           aria-label="{{ t('nav.admin') }}" title="{{ t('nav.admin') }}">
          <span>{{ t("nav.admin") }}</span>
        </a>
      {% endif %}
    {% endif %}
  </nav>
  <div class="topbar-side">
    {% if user %}
      {% include "partials/account_menu.html" %}
    {% else %}
      {% if request.url.path != "/login" %}<a class="navlink" href="/login">{{ t("auth.login") }}</a>{% endif %}
      <span class="lang" role="group" aria-label="{{ t('a11y.language') }}">
        <a href="?lang=pl" class="{{ 'active' if lang == 'pl' }}">PL</a>
        <a href="?lang=en" class="{{ 'active' if lang == 'en' }}">EN</a>
      </span>
    {% endif %}
  </div>
  {% if user %}
    {# On a phone the bar holds the name and this one menu; the links above stay for wider screens. #}
    <details class="mobile-menu">
      <summary class="navlink" aria-label="{{ t('nav.menu') }}">{{ icon.menu(20) }}</summary>
      <nav class="menu-panel">
        <a href="/chat" class="{{ 'active' if request.url.path.startswith('/chat') }}">{{ t("nav.chat") }}</a>
        {% if user.role.value == "admin" %}
          <a href="/admin" class="{{ 'active' if request.url.path.startswith('/admin') }}">{{ t("nav.admin") }}</a>
        {% endif %}
        <a href="/account" class="{{ 'active' if request.url.path.startswith('/account') }}">{{ t("nav.account") }} · {{ user.username }}</a>
        <div class="menu-lang">
          <a href="?lang=pl" class="{{ 'active' if lang == 'pl' }}">Polski</a>
          <a href="?lang=en" class="{{ 'active' if lang == 'en' }}">English</a>
        </div>
        <form method="post" action="/logout"><button type="submit">{{ t("nav.logout") }}</button></form>
      </nav>
    </details>
  {% endif %}
</header>
{% endblock %}
{% block body %}
<main class="container" id="main">{% block content %}{% endblock %}</main>
{% endblock %}
</body>
</html>
