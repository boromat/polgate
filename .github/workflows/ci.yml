name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing here needs to write to the repository.
permissions:
  contents: read

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # 3.12 is the oldest Python the hub supports and the one the image runs; 3.14 is the newest,
    # and what a Windows machine set up today with start.bat is likely to have.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The [ocr] extra brings Pillow, which the scanned-PDF test needs to build its scan. The
      # tesseract binary stays out: the tests stand in for it.
      - name: Install
        run: pip install -e ".[dev,ocr]"

      # `spacy download` is a pip install underneath, so the ~50 MB wheel lands in the pip cache
      # that setup-python already restores. No separate cache step earns its keep here.
      - name: Download the spaCy model
        run: python -m spacy download pl_core_news_md

      - name: Lint
        run: ruff check --output-format=github . && ruff format --check .

      - name: Type-check
        run: mypy polgate

      - name: Test
        run: pytest --cov --cov-report=term-missing

      # The conversations of evals/ through the whole hub, against a local stand-in provider and
      # the mock judge. It fails on any leak or over-masking evals/known_gaps.json does not list.
      # The evaluations measure the hub, not the interpreter: once is enough.
      - name: Leak evaluation
        if: matrix.python == '3.12'
        env:
          JUDGE_BACKEND: mock
        run: python evals/run.py --check

      # Whether the passage holding the answer reaches the model, searched or cut, with stand-in
      # vectors: no network, a few seconds. It fails if the dataset or the ranking code breaks.
      - name: Search in attachments evaluation
        if: matrix.python == '3.12'
        run: python evals/retrieval.py

  package:
    name: Built wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the hub
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      # Every other job installs the source tree in editable mode, which reads templates and static
      # files straight from the checkout. Only a regular install shows what a wheel or the Docker
      # image actually carries.
      - name: Install the wheel, away from the source tree
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/polgate-*.whl

      - name: Serve a page from the installed wheel
        working-directory: /tmp
        env:
          DATABASE_URL: sqlite:////tmp/hub/polgate.db
          UPLOAD_DIR: /tmp/hub/uploads
        run: |
          /tmp/wheel-env/bin/uvicorn polgate.main:app --port 8000 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/login | grep -q "<form"

  docker:
    name: Docker image starts with nothing configured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: polgate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No environment at all, the way somebody trying it for the first time runs it: the hub has to
      # generate its own keys and admin password, keep them in the volume, and serve pages.
      - name: Start
        run: docker run -d --name hub -p 8000:8000 polgate:ci

      - name: Serve a page
        run: |
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/login | grep -q "<form"
          docker exec hub test -s /data/initial-admin-password

      - name: Container log
        if: always()
        run: docker logs hub
